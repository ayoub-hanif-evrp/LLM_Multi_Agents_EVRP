provider_defaults:
  ollama:
    host: http://127.0.0.1:11434
    timeout_s: 300
    keep_alive: 20m

models:
  qwen25_coder_7b:
    enabled: true
    provider: ollama
    model: qwen2.5-coder:7b
    num_ctx: 8192
    note: Core SLM — Alibaba Qwen2.5-Coder ~7B

  deepseek_coder_67b:
    enabled: true
    provider: ollama
    model: deepseek-coder:6.7b
    num_ctx: 8192
    note: Core SLM — DeepSeek Coder ~6.7B

  codellama_7b:
    enabled: true
    provider: ollama
    model: codellama:7b
    num_ctx: 8192
    note: Core SLM — Meta CodeLlama 7B

  qwen25_coder_14b:
    enabled: true
    provider: ollama
    model: qwen2.5-coder:14b
    num_ctx: 8192
    timeout_s: 300
    note: Capacity anchor — Qwen2.5-Coder 14B

  # Stronger local coding-model anchors (not labeled as SLMs in the paper).
  devstral_small_2_24b:
    enabled: true
    provider: ollama
    model: devstral-small-2:24b
    num_ctx: 8192
    timeout_s: 600
    note: Stronger local coding-model anchor — Mistral Devstral Small 2 24B

  qwen3_coder_30b:
    enabled: true
    provider: ollama
    model: qwen3-coder:30b
    num_ctx: 8192
    timeout_s: 600
    note: Stronger local coding-model anchor — Qwen3-Coder 30B

  gpt_oss_20b:
    enabled: true
    provider: ollama
    model: gpt-oss:20b
    num_ctx: 8192
    timeout_s: 600
    note: Stronger local coding-model anchor — GPT-OSS 20B
