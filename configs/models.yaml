provider_defaults:
  ollama:
    host: http://127.0.0.1:11434
    timeout_s: 300
    keep_alive: 20m

models:
  qwen25_coder_7b:
    enabled: true
    provider: ollama
    model: qwen2.5-coder:7b
    num_ctx: 8192
    note: Core SLM — Alibaba Qwen2.5-Coder ~7B

  deepseek_coder_67b:
    enabled: true
    provider: ollama
    model: deepseek-coder:6.7b
    num_ctx: 8192
    note: Core SLM — DeepSeek Coder ~6.7B

  codellama_7b:
    enabled: true
    provider: ollama
    model: codellama:7b
    num_ctx: 8192
    note: Core SLM — Meta CodeLlama 7B

  qwen25_coder_14b:
    enabled: true
    provider: ollama
    model: qwen2.5-coder:14b
    num_ctx: 8192
    timeout_s: 300
    note: Capacity anchor — Qwen2.5-Coder 14B

  # Stronger local coding-model anchors (not labeled as SLMs in the paper).
  devstral_small_2_24b:
    enabled: true
    provider: ollama
    model: devstral-small-2:24b
    num_ctx: 8192
    timeout_s: 600
    note: Stronger local coding-model anchor — Mistral Devstral Small 2 24B

  qwen3_coder_30b:
    enabled: true
    provider: ollama
    model: qwen3-coder:30b
    num_ctx: 8192
    timeout_s: 600
    note: Stronger local coding-model anchor — Qwen3-Coder 30B

  gpt_oss_20b:
    enabled: true
    provider: ollama
    model: gpt-oss:20b
    num_ctx: 8192
    timeout_s: 600
    note: Stronger local coding-model anchor — GPT-OSS 20B

  deepseek_v4_pro:
    enabled: true
    provider: openai_compatible
    model: deepseek-v4-pro
    base_url_env: DEEPSEEK_BASE_URL
    api_key_env: DEEPSEEK_API_KEY
    default_base_url: https://api.deepseek.com/v1
    timeout_s: 600
    note: Frontier coding model — DeepSeek V4 Pro

  gpt6_sol:
    enabled: true
    provider: openai_compatible
    model: gpt-6-sol
    api_key_env: OPENAI_API_KEY
    base_url_env: OPENAI_BASE_URL
    timeout_s: 600
    note: Frontier coding model — GPT-6-sol

  claude_opus_55:
    enabled: true
    provider: openai_compatible
    model: claude-opus-5-5
    api_key_env: ANTHROPIC_API_KEY
    base_url_env: ANTHROPIC_BASE_URL
    default_base_url: https://api.anthropic.com/v1
    timeout_s: 600
    note: Frontier coding model — Claude Opus 5.5

  claude_sonnet_55:
    enabled: true
    provider: openai_compatible
    model: claude-sonnet-5-5
    api_key_env: ANTHROPIC_API_KEY
    base_url_env: ANTHROPIC_BASE_URL
    default_base_url: https://api.anthropic.com/v1
    timeout_s: 600
    note: Frontier coding model — Claude Sonnet 5.5

  qwen3_coder_480b_hosted:
    enabled: true
    provider: openai_compatible
    model: Qwen3-Coder-480B-A35B
    api_key_env: QWEN_API_KEY
    base_url_env: QWEN_BASE_URL
    timeout_s: 900
    note: Hosted frontier coding model — Qwen3-Coder 480B
