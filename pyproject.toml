[project]
name = "evrptw-autolab"
version = "0.1.0"
description = "VoltForge: five-agent autonomous synthesis of executable EVRPTW solvers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "VoltForge contributors" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pydantic>=2.5",
  "typer>=0.12",
  "psutil>=5.9",
  "orjson>=3.9",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
  "mypy>=1.8",
  "types-PyYAML>=6.0",
  "types-requests>=2.31",
  "pandas-stubs>=2.1",
]

[project.scripts]
evrptw-autolab = "evrptw_autolab.cli:main"
voltforge = "evrptw_autolab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evrptw_autolab"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
  "mypy>=1.8",
  "types-PyYAML>=6.0",
  "types-requests>=2.31",
  "pandas-stubs>=2.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "B905", "E501", "E701", "E702"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_ignores = true
packages = ["evrptw_autolab"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["psutil", "requests", "pandas", "matplotlib.*"]
ignore_missing_imports = true
