[project]
name = "evocharge-agent"
version = "0.1.0"
description = "Verifier-grounded agentic discovery of transferable EVRPTW search programs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "EvoCharge-Agent contributors" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pydantic>=2.5",
  "typer>=0.12",
  "psutil>=5.9",
  "orjson>=3.9",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
]

[project.scripts]
evocharge = "evocharge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evocharge"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_ignores = true
packages = ["evocharge"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["psutil"]
ignore_missing_imports = true
